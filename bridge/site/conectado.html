<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Organize</title>
<style>body{font-family:system-ui,sans-serif;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;background:#16121c;color:#ece6f2;text-align:center;padding:24px}main{max-width:22rem}h1{font-size:1.25rem;font-weight:600}p{color:#b9adc7}</style>
</head><body><main><h1 id="t">Pronto</h1><p id="m">Pode voltar ao app.</p></main>
<script>
const q=new URLSearchParams(location.search);
const svc=q.has('drive')?'Google Drive':'Gmail';
const ok=(q.get('drive')||q.get('gmail'))==='ok';
document.getElementById('t').textContent=ok?svc+' conectado':'Não foi possível conectar o '+svc;
document.getElementById('m').textContent=ok?'Pode fechar esta página e voltar ao app.':'Volte ao app e tente de novo em Ajustes.';
</script></body></html>
