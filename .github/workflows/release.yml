---
name: Publicar atualização

# Publica o APK para o botão "Atualizar" de dentro do app, sem o computador de casa: compila o APK
# assinado, envia ao bucket privado app-releases e registra a versão em app_releases (o mesmo que o
# tool/release.sh faz para o Android). Rodar: Actions > Publicar atualização > Run workflow.
#
# A versão é a do app/pubspec.yaml (X.Y.Z+N): suba o +N num commit antes de publicar. Se esse build já
# foi publicado, o workflow para sem enviar nada.
#
# Segredos (Settings > Secrets and variables > Actions):
#   ENV_JSON                   o app/env.json de produção (SUPABASE_URL e SUPABASE_ANON_KEY)
#   ANDROID_KEYSTORE_B64       a chave que assina o app instalado: base64 -w0 ~/.android/debug.keystore
#   SUPABASE_SERVICE_ROLE_KEY  Supabase > Project Settings > API > service_role (ou a secret key sb_secret_…)
on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Novidades (aparecem no aviso de atualização)'
        required: true

concurrency: publicar-atualizacao

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      BUCKET: app-releases
      KEEP: '3'
    steps:
      - uses: actions/checkout@v4

      - name: Conferir os segredos
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          falta=0
          [ -n "$ENV_JSON" ] || { echo "::error::Falta o segredo ENV_JSON"; falta=1; }
          [ -n "$KEYSTORE" ] || { echo "::error::Falta o segredo ANDROID_KEYSTORE_B64 (sem ele o APK não atualiza o app instalado)"; falta=1; }
          [ -n "$SERVICE_KEY" ] || { echo "::error::Falta o segredo SUPABASE_SERVICE_ROLE_KEY"; falta=1; }
          exit $falta

      - name: Configuração e chave de assinatura
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$ENV_JSON" > env.json
          url="$(python3 -c 'import json; print(json.load(open("env.json"))["SUPABASE_URL"].rstrip("/"))')"
          case "$url" in
            https://*) ;;
            *) echo "::error::ENV_JSON precisa do SUPABASE_URL de produção (https://…), não '$url'"; exit 1 ;;
          esac
          echo "SUPABASE_URL=$url" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/organize.keystore"
          echo "ORGANIZE_KEYSTORE=$RUNNER_TEMP/organize.keystore" >> "$GITHUB_ENV"

      - name: Versão (do pubspec)
        id: ver
        run: |
          v="$(sed -n 's/^version:[[:space:]]*\([0-9]*\.[0-9]*\.[0-9]*\)+\([0-9]*\)[[:space:]]*$/\1 \2/p' pubspec.yaml | head -n1)"
          [ -n "$v" ] || { echo "::error::version: X.Y.Z+N não encontrado no pubspec.yaml"; exit 1; }
          name="${v% *}"; build="${v#* }"
          # O versionCode do APK por ABI é 1000*ABI + build: acima de 999 o app não separa os dois.
          [ "$build" -lt 1000 ] || { echo "::error::build $build: o app só entende builds abaixo de 1000"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      # curl com a chave por stdin (config): ela não aparece na linha de comando.
      - name: Preparar o acesso ao Supabase
        run: |
          cat > "$RUNNER_TEMP/api.sh" <<'EOF'
          api() {
            {
              printf 'header = "apikey: %s"\n' "$SERVICE_KEY"
              case "$SERVICE_KEY" in eyJ*) printf 'header = "Authorization: Bearer %s"\n' "$SERVICE_KEY" ;; esac
            } | curl -K - --silent --show-error --fail-with-body "$@"
          }
          EOF

      - name: O build ainda não foi publicado?
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          . "$RUNNER_TEMP/api.sh"
          got="$(api "$SUPABASE_URL/rest/v1/app_releases?platform=eq.android&build=gte.$BUILD&select=version,build")"
          if [ "$got" != "[]" ]; then
            echo "::error::Já existe versão Android com build >= $BUILD ($got). Suba o +N do app/pubspec.yaml e rode de novo."
            exit 1
          fi

      # O caderno guarda PDFs no bucket das imagens (migração 20261028000000_notebook_pdfs):
      # aplica a mesma configuração pela API do Storage, para valer sem precisar do db push.
      - name: Bucket dos cadernos aceita PDF
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          . "$RUNNER_TEMP/api.sh"
          api -X PUT "$SUPABASE_URL/storage/v1/bucket/notebook-images" -H "Content-Type: application/json" \
            --data '{"public":false,"file_size_limit":52428800,"allowed_mime_types":["image/png","image/jpeg","image/webp","image/gif","image/heic","image/heif","application/pdf"]}' >/dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Compilar o APK (arm64, release, ofuscado)
        run: >-
          flutter build apk --release --split-per-abi --target-platform android-arm64
          --obfuscate --split-debug-info=build/symbols
          --dart-define-from-file=env.json
          --build-name=${{ steps.ver.outputs.name }} --build-number=${{ steps.ver.outputs.build }}

      # O APK tem de sair assinado com a chave do segredo; senão o celular recusa a
      # atualização ("App not installed"). Para aqui, antes de publicar, se não sair.
      - name: Conferir a assinatura
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)"
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          got="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)"
          want="$(keytool -exportcert -keystore "$ORGANIZE_KEYSTORE" -storepass android -alias androiddebugkey 2>/dev/null | sha256sum | cut -d' ' -f1)"
          echo "APK:   $got"
          echo "chave: $want"
          echo "Assinatura (SHA-256): \`$got\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "::error::O APK não saiu assinado com a chave do segredo ANDROID_KEYSTORE_B64. Nada foi publicado."
            exit 1
          fi

      - name: Enviar e registrar
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NAME: ${{ steps.ver.outputs.name }}
          BUILD: ${{ steps.ver.outputs.build }}
          NOTES: ${{ inputs.notes }}
        run: |
          . "$RUNNER_TEMP/api.sh"
          apk="Organize-android-$NAME-b$BUILD.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$apk"
          path="android/$BUILD/organizacional-$NAME-b$BUILD.apk"
          sha="$(sha256sum "$apk" | cut -d' ' -f1)"
          size="$(stat -c %s "$apk")"
          echo "Enviando $path ($size bytes, sha256 $sha)"
          api -X POST "$SUPABASE_URL/storage/v1/object/$BUCKET/$path" \
            -H "Content-Type: application/octet-stream" -H "x-upsert: true" \
            --data-binary "@$apk" >/dev/null
          body="$(P=android V="$NAME" B="$BUILD" S="$path" H="$sha" Z="$size" python3 -c '
          import json, os
          print(json.dumps({
              "platform": os.environ["P"], "version": os.environ["V"], "build": int(os.environ["B"]),
              "storage_path": os.environ["S"], "sha256": os.environ["H"], "size_bytes": int(os.environ["Z"]),
              "notes": os.environ["NOTES"],
          }))')"
          api -X POST "$SUPABASE_URL/rest/v1/app_releases?on_conflict=platform,build" \
            -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data "$body" >/dev/null
          echo "APK=$apk" >> "$GITHUB_ENV"
          {
            echo "### Publicado: Android $NAME+$BUILD"
            echo ""
            echo "$NOTES"
            echo ""
            echo "Os celulares veem o aviso ao abrir o app (ou em Ajustes > Sobre > Procurar atualização)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Limpar (mantém as 3 mais novas)
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          . "$RUNNER_TEMP/api.sh"
          old="$(api "$SUPABASE_URL/rest/v1/app_releases?platform=eq.android&select=id,storage_path&order=build.desc&offset=$KEEP")"
          count="$(python3 -c 'import json,sys; print(len(json.load(sys.stdin)))' <<<"$old")"
          [ "$count" -gt 0 ] || exit 0
          echo "Removendo $count versão(ões) antiga(s)"
          prefixes="$(python3 -c 'import json,sys; print(json.dumps({"prefixes":[r["storage_path"] for r in json.load(sys.stdin)]}))' <<<"$old")"
          ids="$(python3 -c 'import json,sys; print(",".join(r["id"] for r in json.load(sys.stdin)))' <<<"$old")"
          api -X DELETE "$SUPABASE_URL/storage/v1/object/$BUCKET" -H "Content-Type: application/json" --data "$prefixes" >/dev/null
          api -X DELETE "$SUPABASE_URL/rest/v1/app_releases?id=in.($ids)" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: Organize-android-${{ steps.ver.outputs.build }}
          path: |
            app/${{ env.APK }}
            app/build/symbols
          retention-days: 30
